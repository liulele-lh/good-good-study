  const article=document.createElement('article');article.className='info';article.id='info-'+code;
  const head=document.createElement('div');head.className='card-head';
  const title=document.createElement('h2');title.textContent=item.name;
  const close=document.createElement('button');close.type='button';close.className='close';close.textContent='隐藏';close.setAttribute('aria-label','隐藏'+item.name);close.onclick=()=>toggleRegion(code);
  head.append(title,close);article.append(head);
  const kind=document.createElement('div');kind.className='kind';kind.textContent=item.kind;article.append(kind);
  const dl=document.createElement('dl');
  for(const [label,value] of [['简称',item.abbr],[item.kind==='自治区'?'首府':'省会',item.capital||'不设省会']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd)}
  article.append(dl);
  if(code==='710000'){const note=document.createElement('p');note.className='note';note.textContent='* 台北按地理教材常用省会表述列出。';article.append(note)}
  cards.prepend(article);
 }else document.getElementById('info-'+code)?.remove();
 document.getElementById('empty').hidden=selected.size>0;
 document.getElementById('status').textContent=(opening?'已显示':'已隐藏')+item.name+'资料';
}
document.querySelectorAll('.region,.zoom-region').forEach(el=>{
 el.addEventListener('click',()=>toggleRegion(el.dataset.code));
 el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleRegion(el.dataset.code)}});
});
</script></body></html>
