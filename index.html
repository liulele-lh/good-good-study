<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="八年级学习资料与三角函数互动课程入口。">
  <title>LeLe 学习空间</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #5d6775;
      --paper: #fffdf6;
      --blue: #3566d6;
      --blue-dark: #24479d;
      --yellow: #ffd85a;
      --line: #d9deea;
      --shadow: 0 18px 50px rgba(45, 64, 105, 0.13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(255, 216, 90, 0.38), transparent 26rem),
        linear-gradient(135deg, #f4f7ff 0%, #fffdf7 55%, #eef8f4 100%);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    a { color: inherit; }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0 56px;
    }

    header {
      max-width: 760px;
      margin-bottom: 38px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 8px 13px;
      border: 1px solid rgba(53, 102, 214, 0.24);
      border-radius: 999px;
      color: var(--blue-dark);
      background: rgba(255, 255, 255, 0.68);
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 8vw, 72px);
      line-height: 1.04;
      letter-spacing: -0.04em;
    }

    h1 span { color: var(--blue); }

    .intro {
      max-width: 650px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.75;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px;
      font-size: 18px;
    }

    .section-title::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .course-card {
      position: relative;
      display: flex;
      min-height: 290px;
      flex-direction: column;
      overflow: hidden;
      padding: 26px;
      border: 1px solid rgba(24, 33, 47, 0.12);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .course-card:hover,
    .course-card:focus-visible {
      transform: translateY(-5px);
      border-color: rgba(53, 102, 214, 0.45);
      box-shadow: 0 23px 58px rgba(45, 64, 105, 0.18);
      outline: none;
    }

    .number {
      width: fit-content;
      padding: 6px 10px;
      border-radius: 9px;
      color: var(--blue-dark);
      background: #eaf0ff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .course-card:nth-child(2) .number {
      color: #7a4e00;
      background: #fff1b8;
    }

    .course-card:nth-child(3) .number {
      color: #17694c;
      background: #dff7ec;
    }

    .icon {
      margin: 26px 0 15px;
      font-size: 42px;
      line-height: 1;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.35;
    }

    .course-card p {
      margin: 10px 0 24px;
      color: var(--muted);
      line-height: 1.65;
    }

    .enter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      color: var(--blue-dark);
      font-weight: 800;
    }

    .arrow {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--blue);
      transition: transform 180ms ease;
    }

    .course-card:hover .arrow { transform: translateX(3px); }

    footer {
      margin-top: 38px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 780px) {
      .page { padding-top: 46px; }
      .course-grid { grid-template-columns: 1fr; }
      .course-card { min-height: 235px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .course-card,
      .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">📚 八年级 · 互动学习</div>
      <h1>LeLe <span>学习空间</span></h1>
      <p class="intro">从生活里的真实问题出发，跟着三个小任务认识三角函数。请选择一节课程开始探索。</p>
    </header>

    <section aria-labelledby="course-heading">
      <h2 class="section-title" id="course-heading">三角函数互动课程</h2>
      <div class="course-grid">
        <a class="course-card" href="./math/trigonometry/trigonometry-intro-interactive-lesson.html">
          <span class="number">LESSON 01</span>
          <span class="icon" aria-hidden="true">🏢</span>
          <h2>不爬楼，怎么量楼高？</h2>
          <p>从影子和角度开始，认识直角三角形中的边与角。</p>
          <span class="enter">开始学习 <span class="arrow" aria-hidden="true">→</span></span>
        </a>

        <a class="course-card" href="./math/trigonometry/trigonometry-interactive-lesson-02-river-width.html">
          <span class="number">LESSON 02</span>
          <span class="icon" aria-hidden="true">🌊</span>
          <h2>不下水，怎么测河宽？</h2>
          <p>在岸边构造直角三角形，用可测量的距离求出河宽。</p>
          <span class="enter">继续探索 <span class="arrow" aria-hidden="true">→</span></span>
        </a>

        <a class="course-card" href="./math/trigonometry/trigonometry-interactive-lesson-03-special-angles-slope.html">
          <span class="number">LESSON 03</span>
          <span class="icon" aria-hidden="true">🔐</span>
          <h2>特殊角密码与斜率</h2>
          <p>拆解 30°、45°、60° 的规律，再把角度与斜率连接起来。</p>
          <span class="enter">破解密码 <span class="arrow" aria-hidden="true">→</span></span>
        </a>
      </div>
    </section>

    <footer>选择课程卡片即可进入，页面链接均适配 GitHub Pages。</footer>
  </main>
</body>
</html>
